<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#92400E" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Badge background -->
  <rect x="2" y="2" width="52" height="52" rx="13" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <!-- Shine -->
  <rect x="2" y="2" width="52" height="52" rx="13" fill="url(#shine)"/>
  <!-- Subtle border -->
  <rect x="2" y="2" width="52" height="52" rx="13" stroke="white" stroke-opacity="0.18" stroke-width="1" fill="none"/>

  <!-- SAC text -->
  <text
    x="28"
    y="36"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="19"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="1"
  >SAC</text>
</svg>
